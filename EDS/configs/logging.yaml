# Logging defaults for the Enterprise Data Simulator.
#
# Platform configuration only.

# Minimum severity emitted. One of: DEBUG, INFO, WARNING, ERROR, CRITICAL.
log_level: INFO

# Log record layout, using printf-style logging placeholders.
log_format: "%(asctime)s %(levelname)-8s %(name)s: %(message)s"

# Timestamp layout for the `asctime` placeholder.
date_format: "%Y-%m-%dT%H:%M:%S%z"

# Emit records to stderr.
log_to_console: true

# Optional log file path relative to the repository root. Null disables
# file logging.
log_file: null
