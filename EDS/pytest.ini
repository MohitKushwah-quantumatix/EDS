[pytest]
minversion = 8.0
testpaths = eds/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: a simulation long enough to be measured in minutes. Excluded by
        default; run with `pytest -m slow`. Reserved for runs whose length is
        the point, and which assert nothing a shorter run does not.
    postgres: requires a reachable PostgreSQL server and the `postgres`
        extra. Skips itself (does not fail) when the server is absent, so it
        is not excluded from the default run the way `slow` is.
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    -m "not slow"
