# Ruff configuration for the Enterprise Data Simulator.

target-version = "py312"
line-length = 100
src = ["eds"]

[lint]
select = [
  "A",   # flake8-builtins
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  # The `eds.exporters.csv` package name is mandated by the repository
  # structure in the specification; it is always imported absolutely and
  # therefore does not shadow the standard library `csv` module in practice.
  "A005",
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["eds"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
