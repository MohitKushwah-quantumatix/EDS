# EDS Loader configuration — generated by 'eds-loader init'
# Fill in all required fields and then validate with:
#   eds-loader validate -c <this-file>

source:
  kind: remote_fs
  host: 192.168.1.20  # required
  username: mohitkushwah       # required
  remote_path: D:\EDS\EDS\my-shop  # required -- remote directory containing .parquet + schema.json
  port: 22                 # optional -- default: 22
  # password_env: SFTP_PASSWORD   # env-var holding the password (preferred)
  # password: ""                  # inline password (not recommended for production)
  # key_filename: ~/.ssh/id_rsa   # path to private key file

target:
  kind: postgres
  host: localhost           # required
  database: eds_db          # required
  user: postgres          # required
  #password_env: EDS_PG_PASSWORD  # env-var holding the password (preferred)
  password: "root1234"                 # inline password (not recommended for production)
  port: 5432                # optional -- default: 5432
  schema: public            # optional -- default: public

# Optional loader settings
tables: []                  # empty = load every dataset in schema.json
                            # or specify a subset: [customers, orders]
enforce_constraints: false   # set to false to skip PK/FK/UNIQUE enforcement
schema_required: false       # set to false if there is no schema.json at the source
                            # (datasets will be auto-discovered from *.parquet files)
