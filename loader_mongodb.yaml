# EDS Loader configuration — generated by 'eds-loader init'
# Fill in all required fields and then validate with:
#   eds-loader validate -c <this-file>

source:
  kind: local_fs
  path: C:\Users\Mohit Patel\Downloads\healthcare_domain_data         # required -- directory containing .parquet + schema.json
  format: csv       # optional -- parquet (default) | csv | json | ndjson | excel | avro | orc


target:
  kind: mongodb
  host: localhost           # required
  database: eds_db          # required
  # username: eds_loader          # optional -- omit for unauthenticated connections
  # password_env: EDS_MONGO_PASSWORD
  port: 27017               # optional -- default: 27017
  # auth_source: admin            # optional -- authentication database, default: admin

# Optional loader settings
tables: []                  # empty = load every dataset in schema.json
                            # or specify a subset: [customers, orders]
enforce_constraints: false  # set to false to skip PK/FK/UNIQUE enforcement
schema_required: false      # set to false if there is no schema.json at the source
                            # (datasets will be auto-discovered from *.parquet files)
