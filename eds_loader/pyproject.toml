[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eds-loader"
description = "EDS Loader Tool — moves EDS-generated Parquet data to any target, config-driven."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Makin Laboratories" }]
keywords = ["eds", "data-loader", "etl", "synthetic-data", "enterprise"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Database",
  "Topic :: System :: Archiving",
  "Topic :: Utilities",
]

# Core runtime deps — no eds_core here (FR-1).
# Polars: reading Parquet and moving DataFrames between connectors.
# Pydantic: config validation.
# Typer: CLI.
# PyYAML: loading the loader.yaml config file.
dependencies = [
  "polars>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# One extra per connector family — install only what you need.
postgres   = ["psycopg[binary]>=3.1", "sqlalchemy>=2.0"]
mysql      = ["pymysql>=1.1",          "sqlalchemy>=2.0"]
mssql      = ["pyodbc>=5.0",           "sqlalchemy>=2.0"]
oracle     = ["oracledb>=2.0",         "sqlalchemy>=2.0"]
mongodb    = ["pymongo>=4.0"]
s3         = ["boto3>=1.34"]
azure_blob = ["azure-storage-blob>=12.19"]
gcs        = ["google-cloud-storage>=2.16"]
remote_fs  = ["paramiko>=3.4"]
excel      = ["openpyxl>=3.1"]

# Install every driver at once.
all = [
  "eds-loader[postgres,mysql,mssql,oracle,mongodb,s3,azure_blob,gcs,remote_fs,excel]",
]

# Development tooling — mirrors eds_core conventions.
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "paramiko>=3.4",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "pymongo>=4.5",
  "boto3>=1.28",
  "azure-storage-blob>=12.19",
  "google-cloud-storage>=2.14",
]

[project.scripts]
eds-loader = "eds_loader.cli.main:app"

[tool.hatch.version]
path = "eds_loader/version.py"
# Explicit pattern: matches `__version__: str = "x.y.z"` (type-annotated).
pattern = '^__version__: str = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["eds_loader"]

[tool.hatch.build.targets.sdist]
include = ["eds_loader", "tests", "README.md"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
pretty = true
